# Run from repo root: docker compose -f test/docker-compose.test.yml up --build --exit-code-from playwright
services:
  app:
    build:
      context: ..
    environment:
      LLM_MOCK: "true"
      MASSIVE_API_KEY: ""
      DB_PATH: /app/db/finally.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  playwright:
    image: mcr.microsoft.com/playwright:v1.49.0-jammy
    working_dir: /work
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://app:8000
    volumes:
      - ./:/work
    command: sh -c "npm install && npx playwright test"
